<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Scores, rankings and RSVPs for the Friday Cornhole League.">

  <!-- Add to homescreen for Chrome on Android -->
<meta name="google-signin-client_id" content="80061893239-lrhh80j701db38napkukm2jkgo8f2sfl.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FCL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Colours the browser chrome on mobile to match the app. -->
  <meta name="theme-color" content="#2C5C0F">

  <title>Cornhole League</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Branded splash for the cold load.
       A Flutter web bundle is a few megabytes, so the first visit shows a
       blank white page for a second or two while it downloads — which reads
       as a broken site rather than a loading one. This fills that gap and is
       removed by the app itself once the first frame paints. */
    html, body { margin: 0; padding: 0; height: 100%; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #2C5C0F 0%, #3B6D11 55%, #4E8A17 100%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .mark {
      width: 84px; height: 84px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .28);
      border: 2px solid #FAC775;
      color: #FAC775;
      font-size: 30px; font-weight: 800; letter-spacing: 2px;
    }
    #splash .name {
      margin-top: 18px; color: #fff;
      font-size: 15px; font-weight: 700; letter-spacing: 2.5px;
    }
    #splash .bar {
      margin-top: 22px; width: 132px; height: 3px; border-radius: 2px;
      background: rgba(255, 255, 255, .22); overflow: hidden;
    }
    #splash .bar i {
      display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #FAC775; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(330%); }
    }
    /* Respect a reduced-motion preference rather than animating regardless. */
    @media (prefers-reduced-motion: reduce) {
      #splash .bar i { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="mark">FCL</div>
    <div class="name">CORNHOLE LEAGUE</div>
    <div class="bar"><i></i></div>
  </div>

  <script>
    // Flutter fires this once the first frame is on screen.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
